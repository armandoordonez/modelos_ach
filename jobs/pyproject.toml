[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ach-jobs"
version = "0.1.0"
description = "Pipeline de procesamiento y modelos analíticos sobre datos de ACH Colombia"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "scikit-learn>=1.5,<2",
    "scipy>=1.11",
    "joblib>=1.3",
    "pandera>=0.20",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "fsspec>=2024.2",
    "s3fs>=2024.2",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
ach-processing = "processing.main:main"
ach-model = "models.runner:main"

[tool.setuptools]
packages = [
    "common",
    "processing",
    "models",
    "models.caso02_ingresos",
    "models.caso04_rfm",
    "models.caso04_propension",
    "models.caso05_clv",
    "models.caso05_ciclo_vida",
    "models.caso05_pensionados",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "parity: compara métricas contra los notebooks originales (requiere dataset curado)",
    "integration: requiere MinIO o Docker",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["common", "processing", "models"]
